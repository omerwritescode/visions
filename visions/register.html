<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | VISION</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('background3.jpg');
            background-size: cover;
            background-position: center;
            font-family: 'Arial', sans-serif;
            color: white;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background-color: rgba(0, 0, 0, 0.8);
        }

        .navbar-brand img {
            height: 60px;
        }

        .register-container {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 3rem 0;
        }

        .register-card {
            background-color: rgba(0, 0, 0, 0.8);
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 600px;
        }

        .form-control {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .btn-custom {
            background-color: #800000;
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 30px;
            font-size: 18px;
            transition: background-color 0.3s;
        }

        .btn-custom:hover {
            background-color: #d28117;
        }

        .form-title {
            font-size: 2.5rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 25px;
        }

        .footer {
            background-color: rgba(0, 0, 0, 0.8);
            text-align: center;
            padding: 0.5rem 0;
            position: relative;
            bottom: 0;
            width: 100%;
            color: #d28117;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">
            <img src="vision logo (1).png" alt="VISION Logo">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="visionverse.html">VisionVerse</a></li>
                <li class="nav-item"><a class="nav-link" href="partners.html">Partners</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        More
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                        <li><a class="dropdown-item" href="crew.html">The Crew</a></li>
                        <li><a class="dropdown-item" href="m&m.html">Moments & Memories</a></li>
                        <li><a class="dropdown-item" href="visionary tale.html">The Visionary Tale</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Register Section -->
<div class="register-container">
    <div class="register-card">
        <h2 class="form-title">Register for VISION Fest</h2>
        <form>
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
            </div>

            <div class="mb-3">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="tel" class="form-control" id="phone" placeholder="Enter your phone number" required>
            </div>

            <div class="mb-3">
                <label for="college" class="form-label">College Name</label>
                <input type="text" class="form-control" id="college" placeholder="Enter your college name" required>
            </div>

            <div class="mb-3">
                <label for="event" class="form-label">Select Event</label>
                <select class="form-select form-control" id="event" required>
                    <option value="" disabled selected>Choose an event</option>
                    <option value="dance">Group Dance</option>
                    <option value="trivia">Trivia Quiz</option>
                    <option value="cricket">Cricket</option>
                    <option value="treasure-hunt">Treasure Hunt</option>
                </select>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-custom">Register</button>
            </div>
        </form>
    </div>
</div>

<!-- Footer -->
<div class="footer">
    <p>&copy; 2024 VISION Fest | All Rights Reserved</p>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>

</body>
</html>
